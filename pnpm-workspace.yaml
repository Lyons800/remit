packages:
  - apps/*
  - services/*
  - packages/*

overrides:
  '@grpc/grpc-js@>=1.12.0 <1.12.7': 1.12.7
  postcss: 8.5.23
  'protobufjs@>=8.0.0 <8.6.6': 8.6.6
  sharp: 0.35.3
  undici-types@~6.19.2: 6.19.2
  'ws@>=8.0.0 <8.21.0': 8.21.0

catalog:
  '@eslint/js': 10.0.1
  '@hono/node-server': 2.0.11
  '@types/node': 24.13.3
  '@types/react': 19.2.17
  '@types/react-dom': 19.2.3
  eslint: 10.8.0
  hono: 4.12.32
  next: 16.2.11
  postgres: 3.4.9
  prettier: 3.9.6
  react: 19.2.8
  react-dom: 19.2.8
  turbo: 2.10.6
  tsx: 4.23.1
  typescript: 6.0.3
  typescript-eslint: 8.65.0
  vitest: 4.1.10
  zod: 4.4.3

nodeVersion: 24.11.0
engineStrict: true
enableGlobalVirtualStore: false
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
trustPolicyExclude:
  # Reviewed legacy transitives in the pinned @hiero-ledger/sdk@2.85.0 graph.
  # The lockfile pins their integrity; neither artifact publishes npm provenance.
  - semver@6.3.1
  - undici-types@6.19.8
blockExoticSubdeps: true
strictDepBuilds: true
allowBuilds:
  esbuild: true
  # Only reviewed protobufjs versions may run the package's install check.
  protobufjs@7.6.5: false
  protobufjs@8.6.6: true
  sharp: true
