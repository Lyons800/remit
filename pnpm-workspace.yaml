packages:
  - apps/*
  - services/*
  - packages/*

overrides:
  postcss: 8.5.23
  sharp: 0.35.3

catalog:
  '@eslint/js': 10.0.1
  '@hono/node-server': 2.0.11
  '@types/node': 26.1.1
  '@types/react': 19.2.17
  '@types/react-dom': 19.2.3
  eslint: 10.7.0
  hono: 4.12.32
  next: 16.2.11
  prettier: 3.9.6
  react: 19.2.8
  react-dom: 19.2.8
  turbo: 2.10.6
  tsx: 4.23.1
  typescript: 6.0.3
  typescript-eslint: 8.65.0
  vitest: 4.1.10
  zod: 4.4.3

nodeVersion: 24.11.0
engineStrict: true
enableGlobalVirtualStore: false
minimumReleaseAge: 1440
