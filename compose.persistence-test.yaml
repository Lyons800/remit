services:
  postgres:
    image: postgres:17-alpine@sha256:3430fe182f5065a6ea505c3d432d2c7fff18fbab954df8f277c1dbf4c70124af
    environment:
      POSTGRES_DB: invoiceguard_test
      POSTGRES_PASSWORD: invoiceguard_test
      POSTGRES_USER: invoiceguard_test
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U invoiceguard_test -d invoiceguard_test
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - 127.0.0.1:55432:5432
    tmpfs:
      - /var/lib/postgresql/data
