name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  persistence:
    name: PostgreSQL persistence
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine@sha256:3430fe182f5065a6ea505c3d432d2c7fff18fbab954df8f277c1dbf4c70124af
        env:
          POSTGRES_DB: invoiceguard_test
          POSTGRES_PASSWORD: invoiceguard_test
          POSTGRES_USER: invoiceguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invoiceguard_test -d invoiceguard_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      PERSISTENCE_TEST_DISPOSABLE_CONFIRM: invoiceguard-persistence-disposable-v1
      PERSISTENCE_TEST_DATABASE_URL: postgresql://invoiceguard_test:invoiceguard_test@127.0.0.1:5432/invoiceguard_test

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          run_install: false
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: 24.11.0

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build persistence dependencies
        run: pnpm --filter @invoiceguard/persistence... build

      - name: Run PostgreSQL contract tests
        run: pnpm test:persistence

  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          run_install: false
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: 24.11.0

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository checks
        run: pnpm check
